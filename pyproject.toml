[project]
name = "strmflow"
version = "0.5.0"
description = "基于 FastAPI 的 OpenList STRM 追更与转存服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.5",
    "cryptography>=50.0.1",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.1",
    "sqlalchemy[asyncio]>=2.0.43",
    "starlette>=0.47.0",
    "telethon>=1.42.0,<2",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "respx>=0.22.0",
    "ruff>=0.16.7",
]

[project.scripts]
strmflow = "strmflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strmflow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
